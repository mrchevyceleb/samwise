# Install as samwise-agent-one.service.d/team-claude.conf.
# Rust validates this team subscription again before every Claude spawn.
[Service]
# Auth refusal is intentional: stay stopped instead of retrying forever.
RestartPreventExitStatus=78
Environment=CLAUDE_CONFIG_DIR=/home/mrchevyceleb/.claude-tardis
UnsetEnvironment=ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_BASE_URL ANTHROPIC_CUSTOM_HEADERS CLAUDE_CODE_OAUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN_FILE CLAUDE_CODE_USE_BEDROCK CLAUDE_CODE_USE_VERTEX CLAUDE_CODE_USE_FOUNDRY CLAUDE_CODE_SIMPLE CLAUDECODE ANTHROPIC_DEFAULT_OPUS_MODEL ANTHROPIC_DEFAULT_SONNET_MODEL ANTHROPIC_DEFAULT_HAIKU_MODEL ANTHROPIC_MODEL
